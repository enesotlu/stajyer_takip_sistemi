services:
  web:
    build: .
    # Artik disariya dogrudan port acmiyoruz - sadece Caddy'nin (asagida)
    # container ici agdan web:8080'e ulasabilmesi yeterli. Internetten gelen
    # tum trafik once Caddy'den geciyor, HTTPS orada sonlaniyor.
    expose:
      - "8080"
    environment:
      # Veritabani artik yerel bir container'da degil, Amazon RDS'te (SQL
      # Server Express, ucretsiz kota) - bu yuzden burada "db" servisi yok,
      # dogrudan RDS endpoint'ine baglaniyoruz.
      ConnectionStrings__DefaultConnection: "Server=${RDS_ENDPOINT};Database=StajyerTakipDb;User Id=${RDS_KULLANICI_ADI};Password=${RDS_SIFRE};TrustServerCertificate=True"
      EmailAyarlari__SmtpSunucu: "${SMTP_SUNUCU}"
      EmailAyarlari__SmtpPort: "${SMTP_PORT}"
      EmailAyarlari__KullaniciAdi: "${SMTP_KULLANICI_ADI}"
      EmailAyarlari__Sifre: "${SMTP_SIFRE}"
      EmailAyarlari__GonderenEmail: "${SMTP_GONDEREN_EMAIL}"
    volumes:
      - stajyer-takip-dataprotection-keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Caddy, aldigi Let's Encrypt sertifikalarini burada saklar - kalici
      # olmazsa her yeniden baslamada yeniden sertifika istemesi gerekir.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  stajyer-takip-dataprotection-keys:
  caddy-data:
  caddy-config:
